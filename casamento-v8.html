ame="apple-mobile-web-app-status-bar-style" content="default"><title>Karine & Murilo – Nosso Casamento</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--card:#fff;--ink:#2a2d22;--mut:#77796c;--line:#e2e5d6;--acc:#4a5a23;--acc2:#f0f2e6;--ok:#4d8a4a;--no:#b4443c;--wait:#a9761a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{background:#fff!important;color-scheme:light only;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:#fff!important;color:var(--ink);font:16px/1.5 'DM Sans',system-ui,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:20px 16px 60px}
h1{font:600 clamp(2.2rem,8vw,3.4rem)/1.05 'Cormorant Garamond',Georgia,serif;color:var(--acc);margin:0}
header{text-align:center;padding:18px 0 8px}
.sub{color:var(--mut);margin-top:6px}
.count{font:600 1.3rem 'Cormorant Garamond',serif;margin-top:6px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:18px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 6px;text-align:center;cursor:pointer}
.stat b{display:block;font:600 1.9rem 'Cormorant Garamond',serif;line-height:1.1}
.stat span{font-size:.78rem;color:var(--mut)}
.stat.ok b{color:var(--ok)}.stat.no b{color:var(--no)}.stat.wait b{color:var(--wait)}
.bar{display:flex;height:8px;border-radius:6px;overflow:hidden;background:var(--line);margin-bottom:14px}.bar i{display:block;height:100%}
nav{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
nav button{background:none;border:0;font:500 .95rem 'DM Sans';color:var(--mut);padding:10px 12px;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
nav button[aria-selected=true]{color:var(--acc);border-color:var(--acc)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.panel{display:none}.panel.on{display:block}
.add{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:16px}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
.btn{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:9px 14px;font:500 .95rem 'DM Sans';cursor:pointer}
.btn.ghost{background:none;color:var(--acc);border:1px solid var(--acc)}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}.tools input{flex:1;min-width:160px}.tools select{width:auto}
.g{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--wait);border-radius:10px;padding:10px 12px;margin-bottom:8px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.g.ok{border-left-color:var(--ok)}.g.no{border-left-color:var(--no)}.g.m{border-left-color:var(--acc)}
.g .n{flex:1 1 180px}.g .n b{display:block}.g .n small{color:var(--mut)}
.g select{width:auto;font-size:.9rem}
.x{background:none;border:0;color:var(--mut);cursor:pointer;font-size:1.1rem;padding:4px 8px}
.wa{color:var(--ok);font-size:.9rem;text-decoration:none;border:1px solid var(--ok);border-radius:8px;padding:5px 9px}
.empty,small.e{color:var(--mut)}.empty{text-align:center;padding:28px 10px}
.rsvp{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:14px}
.rsvp input{width:auto}.rsvp.warn{border-color:var(--no);background:color-mix(in srgb,var(--no) 12%,var(--card))}.rsvp span{font-weight:500}
.sum{font:600 1.2rem 'Cormorant Garamond',serif;color:var(--acc);margin-bottom:10px}
.tb{background:var(--card);border:1px dashed var(--line);border-radius:10px;padding:10px;margin-bottom:10px}
.tb.over{border-color:var(--no)}.tb.pool{background:none}
.th{display:flex;gap:10px;align-items:center;margin-bottom:6px}.th span{flex:1;color:var(--mut);font-size:.9rem}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:3px 10px;margin:3px;font-size:.9rem;cursor:grab}
.chip.sel{background:var(--acc);color:#fff;border-color:var(--acc)}
.chip button{background:none;border:0;color:inherit;cursor:pointer;padding:0 2px}
.idea{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px;display:flex;gap:12px}
.idea input{width:20px;height:20px;margin-top:3px;accent-color:var(--acc);flex:none}
.idea b{display:block}.idea span{color:var(--mut);font-size:.92rem}.idea.done{opacity:.6}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:20px;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
nav{gap:4px;border-bottom:0;padding-bottom:2px}
nav button{border-radius:20px;border-bottom:0;padding:8px 14px}
nav button[aria-selected=true]{background:var(--acc2);color:var(--acc);font-weight:700}
.ico{width:18px;height:18px;stroke:var(--acc);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;vertical-align:-4px;margin-right:6px}
.stat,.g,.add,.rsvp,.tb,.idea{border-radius:14px;box-shadow:0 1px 2px rgba(70,80,20,.06)}
.g{border-left-width:3px;padding:12px 14px}
.stat{padding:14px 6px}.add{padding:16px}
.btn{border-radius:10px}
.orn{color:var(--acc);display:block;margin:0 auto 6px}
.sum{color:var(--acc)}
@media(max-width:520px){.stats{grid-template-columns:repeat(2,1fr)}}

.wrap{padding-bottom:110px}
.gh{font:600 1.4rem 'Cormorant Garamond',serif;color:var(--acc);margin:20px 0 8px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:#fff;border-top:1px solid var(--line);margin:0;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));justify-content:flex-start}
nav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.7rem;min-width:66px;padding:6px 8px;border-radius:12px}
nav .ico{width:22px;height:22px;margin:0}
.toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
input,select,.btn{min-height:46px}
.x{padding:10px 12px}.chip{padding:8px 12px}
.idea{padding:14px}

.sync{font-size:.8rem;color:var(--mut);margin-top:4px}
@media(max-width:520px){.wrap{padding:12px 14px 110px}.add{grid-template-columns:1fr}.tools select,.tools .btn{flex:1}.g select{flex:1 1 40%}h1{font-size:2.3rem}}
</style>
</head>
<body>
<div class="wrap">
<header>
<svg class="orn" width="120" height="28" viewBox="0 0 120 28" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><path d="M8 14h104"/><path d="M60 14c-4-8-10-9-14-8 1 5 6 9 14 8zM60 14c4-8 10-9 14-8-1 5-6 9-14 8zM60 14c-4 8-10 9-14 8 1-5 6-9 14-8zM60 14c4 8 10 9 14 8-1-5-6-9-14-8z"/></svg>
<h1><input id="names" style="font:inherit;color:inherit;background:none;border:0;text-align:center;width:100%" aria-label="Nomes dos noivos"></h1>
<div class="sub"><svg class="ico" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>Data do casamento: <input type="date" id="date" style="width:auto"></div>
<div class="count" id="count"></div>
<div class="sync" id="sync">Conectando…</div>
</header>
<div class="stats" id="stats"></div>
<div class="bar" id="bar"></div>
<nav role="tablist" id="nav"></nav>

<section class="panel on" id="lista">
<div class="rsvp" id="rsvp">Prazo para confirmar presença <input type="date" id="rsvpD" aria-label="Prazo do RSVP"><span id="rsvpMsg"></span></div>
<div class="add">
<input id="fn" placeholder="Nome do convidado">
<input id="fp" placeholder="Acompanhantes (nº)" type="number" min="0">
<input id="fg" placeholder="Grupo (família, trabalho…)">
<select id="fs"><option value="wait">Sem resposta</option><option value="ok">Confirmado</option><option value="no">Não vai</option></select>
<input id="ft" placeholder="WhatsApp (com DDD)">
<input id="fo" placeholder="Observação (alergia…)">
<button class="btn" id="addBtn">Adicionar convidado</button>
</div>
<div class="tools">
<input id="q" placeholder="Buscar por nome ou grupo">
<select id="flt"><option value="all">Todos</option><option value="ok">Confirmados</option><option value="no">Não vão</option><option value="wait">Sem resposta</option></select>
<button class="btn ghost" id="copy">Copiar lista</button>
<button class="btn ghost" id="csv">Baixar planilha</button>
</div>
<div id="list"></div>
</section>

<section class="panel" id="mesas">
<p class="sub" style="margin-top:0">Só confirmados aparecem aqui. Arraste o convidado até a mesa, ou toque nele e depois na mesa.</p>
<div class="add" style="grid-template-columns:2fr 1fr auto"><input id="tn" placeholder="Nome da mesa (ex.: Família Karine)"><input id="tc" type="number" min="1" placeholder="Lugares"><button class="btn" id="tAdd">Criar mesa</button></div>
<div id="tbls"></div>
</section>

<div id="mods"></div>

<section class="panel" id="ideias">
<p class="sub" style="margin-top:0">Marque o que ainda quer incluir no planejamento.</p>
<div id="ideaList"></div>
<div class="add" style="grid-template-columns:1fr auto"><input id="ni" placeholder="Sua própria ideia"><button class="btn" id="niBtn">Adicionar</button></div>
</section>
</div>
<div class="toast" id="toast"></div>

<script>
const KEY='casamento-v1',LBL={ok:'Confirmado',no:'Não vai',wait:'Sem resposta'};
const CATS=['Entrada','Prato principal','Acompanhamento','Sobremesa','Bebidas'];
const MODS={
 orcamento:{t:'Orçamento',ti:['item'],f:[['item','Item','t'],['prev','Previsto (R$)','n'],['pago','Pago (R$)','n']],sum:['prev','pago','Previsto']},
 presentes:{t:'Presentes',ti:['item'],f:[['item','Presente ou cota','t'],['valor','Valor (R$)','n'],['pix','Link ou chave Pix','t'],['st','Situação','s',['Disponível','Reservado','Presenteado']]]},
 cronograma:{t:'Cronograma',ti:['hora','ativ'],f:[['hora','Hora','h'],['ativ','O que acontece','t'],['resp','Responsável','t']],ord:r=>r.hora||'99'},
 fornecedores:{t:'Fornecedores',ti:['nome'],f:[['nome','Fornecedor','t'],['serv','Serviço','t'],['tel','Contato','t'],['total','Total (R$)','n'],['pago','Pago (R$)','n'],['venc','Próximo pagamento','d'],['ctr','Contrato (link ou nota)','t']],sum:['total','pago','Contratado'],ord:r=>r.venc||'9999'},
 cardapio:{t:'Cardápio',ti:['item'],f:[['cat','Categoria','s',CATS],['item','Prato ou bebida','t'],['obs','Observação','t']],ord:r=>CATS.indexOf(r.cat)}
};
const IDEAS=[
['Arco de flores ou folhagens','Moldura do altar ou do ponto de fotos.','Decoração e adereços'],
['Letreiro com as iniciais K & M','Letras iluminadas para a pista ou a entrada.','Decoração e adereços'],
['Cabine de fotos com adereços','Óculos, chapéus, bigodes e plaquinhas divertidas.','Decoração e adereços'],
['Plaquinhas para fotos','Frases como "Ela disse sim" e "Casou, tá casado".','Decoração e adereços'],
['Velas e lanternas','Clima aconchegante nas mesas e no corredor.','Decoração e adereços'],
['Cordão de luzes','Iluminação suave no teto ou nas árvores.','Decoração e adereços'],
['Centro de mesa e sousplat','Flores, folhas de oliveira, toalhas e guardanapos.','Decoração e adereços'],
['Marcadores de mesa e cardápio impresso','Cartões com o nome de cada convidado.','Decoração e adereços'],
['Painel de fotos do casal','Linha do tempo da história de vocês.','Decoração e adereços'],
['Livro de mensagens','Convidados deixam recados e assinaturas.','Decoração e adereços'],
['Buquê e lapelas','Buquê da noiva, boutonnière e flores dos padrinhos.','Decoração e adereços'],
['Almofada das alianças e pétalas','Detalhes da entrada e do corredor.','Decoração e adereços'],
['Kit chinelos e leques','Conforto e cor para a pista de dança.','Decoração e adereços'],
['Lembrancinhas personalizadas','Quantidade, fornecedor e prazo de entrega.','Decoração e adereços'],
['Votos personalizados','Escrever e ensaiar os votos.','Cerimônia e festa'],
['Playlist','Músicas da entrada, da pista e as que não podem tocar.','Cerimônia e festa'],
['Pajens e daminhas','Roupas, ensaio e quem leva as alianças.','Cerimônia e festa'],
['Bolo e mesa de doces','Sabores, topo do bolo e docinhos.','Cerimônia e festa'],
['Padrinhos e madrinhas','Convites e tarefas de cada um.','Organização'],
['Transporte e hospedagem','Quem vem de fora e precisa de carona ou hotel.','Organização'],
['Restrições alimentares','Alergias e cardápio infantil por convidado.','Organização'],
['Lista de tarefas','Prova do vestido, cartório, degustação.','Organização']];
let S={names:'Karine & Murilo',date:'2033-11-19',rsvp:'',guests:[],tables:[],data:{},ideas:{},custom:[]},sel=null;
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
if(!S.names||S.names==='Nome & Nome')S.names='Karine & Murilo';
if(!S.date)S.date='2033-11-19';
const $=i=>document.getElementById(i);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const brl=v=>'R$ '+(+v||0).toLocaleString('pt-BR',{maximumFractionDigits:2}),fmtD=d=>d.split('-').reverse().join('/');
const days=d=>Math.ceil((new Date(d+'T12:00:00')-new Date())/864e5),people=g=>1+(+g.plus||0);
const uid=()=>Date.now()+''+Math.floor(Math.random()*999);
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1800)}

/* Cabeçalho, estatísticas, RSVP */
function head(){
 const c={ok:0,no:0,wait:0},p={ok:0,no:0,wait:0},tot=S.guests.length;
 S.guests.forEach(g=>{c[g.status]++;p[g.status]+=people(g)});
 $('stats').innerHTML=[['all','Convidados',tot,'',p.ok+p.no+p.wait],['ok','Confirmados',c.ok,'ok',p.ok],['no','Não vão',c.no,'no',p.no],['wait','Sem resposta',c.wait,'wait',p.wait]].map(x=>`<div class="stat ${x[3]}" data-f="${x[0]}"><b>${x[2]}</b><span>${x[1]} · ${x[4]} pessoas</span></div>`).join('');
 $('bar').innerHTML=tot?['ok','wait','no'].map(k=>`<i style="width:${c[k]/tot*100}%;background:var(--${k})"></i>`).join(''):'';
 const el=$('count');
 if(!S.date)el.textContent='Defina a data para ver a contagem regressiva';
 else{const d=days(S.date);el.textContent=d>1?`Faltam ${d} dias`:d===1?'É amanhã!':d===0?'É hoje!':`Casados há ${-d} dias`}
 let m='Defina o prazo de confirmação',w=c.wait,cls='rsvp';
 if(S.rsvp){const d=days(S.rsvp);m=d<0?`Prazo encerrado há ${-d} dia(s)`:d===0?'O prazo termina hoje':`Faltam ${d} dia(s)`;m+=w?` · ${w} ainda sem resposta`:' · todos responderam';if(w&&d<=7)cls+=' warn'}
 $('rsvp').className=cls;$('rsvpMsg').textContent=m;
}

/* Convidados */
const filtered=()=>{const f=$('flt').value,q=$('q').value.toLowerCase();return S.guests.filter(g=>(f==='all'||g.status===f)&&(g.name+' '+g.group).toLowerCase().includes(q)).sort((a,b)=>a.name.localeCompare(b.name))};
function renderGuests(){
 head();const L=filtered();
 $('list').innerHTML=L.length?L.map(g=>{
  const wa=g.phone?`<a class="wa" target="_blank" rel="noopener" href="https://wa.me/55${g.phone.replace(/\D/g,'')}?text=${encodeURIComponent('Oi '+g.name.split(' ')[0]+'! Você consegue confirmar sua presença no nosso casamento?')}">WhatsApp</a>`:'';
  return `<div class="g ${g.status}"><div class="n"><b>${esc(g.name)}${g.plus>0?' +'+g.plus:''}</b><small>${esc(g.group||'Sem grupo')}${g.note?' · '+esc(g.note):''}</small></div>${wa}<select data-s="${g.id}" aria-label="Status">${['wait','ok','no'].map(k=>`<option value="${k}"${g.status===k?' selected':''}>${LBL[k]}</option>`).join('')}</select><button class="x" data-d="${g.id}" aria-label="Remover ${esc(g.name)}">✕</button></div>`}).join(''):
  `<div class="empty">${S.guests.length?'Nenhum convidado nesse filtro.':'Sua lista está vazia. Adicione o primeiro convidado acima.'}</div>`;
}
$('addBtn').onclick=()=>{
 const n=$('fn').value.trim();if(!n){toast('Digite o nome do convidado');$('fn').focus();return}
 S.guests.push({id:uid(),name:n,plus:+$('fp').value||0,group:$('fg').value.trim(),status:$('fs').value,phone:$('ft').value.trim(),note:$('fo').value.trim()});
 ['fn','fp','fg','ft','fo'].forEach(i=>$(i).value='');save();renderAll();toast('Convidado adicionado');$('fn').focus()};
$('fn').onkeydown=e=>{if(e.key==='Enter')$('addBtn').click()};
$('q').oninput=renderGuests;$('flt').onchange=renderGuests;
$('list').onchange=e=>{const id=e.target.dataset.s;if(!id)return;S.guests.forEach(g=>{if(g.id===id)g.status=e.target.value});save();renderAll()};
$('list').onclick=e=>{const id=e.target.dataset.d;if(!id)return;const g=S.guests.find(x=>x.id===id);if(confirm('Remover '+g.name+' da lista?')){S.guests=S.guests.filter(x=>x.id!==id);save();renderAll()}};
$('stats').onclick=e=>{const s=e.target.closest('.stat');if(s){$('flt').value=s.dataset.f;renderGuests()}};
$('copy').onclick=()=>{const t=filtered().map(g=>`${g.name}${g.plus>0?' (+'+g.plus+')':''} – ${LBL[g.status]}`).join('\n');if(!t){toast('Nada para copiar');return}
 try{navigator.clipboard.writeText(t).then(()=>toast('Lista copiada'),()=>toast('Não foi possível copiar'))}catch(e){toast('Não foi possível copiar')}};
$('csv').onclick=()=>{const rows=[['Nome','Acompanhantes','Grupo','Status','WhatsApp','Observação']].concat(S.guests.map(g=>[g.name,g.plus,g.group,LBL[g.status],g.phone,g.note]));
 const c=rows.map(r=>r.map(v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"').join(';')).join('\n');
 const a=document.createElement('a');a.href='data:text/csv;charset=utf-8,\ufeff'+encodeURIComponent(c);a.download='convidados.csv';a.click()};
$('names').oninput=function(){S.names=this.value;save();document.title=this.value+' – Nosso Casamento'};
$('date').onchange=function(){S.date=this.value;save();head()};
$('rsvpD').onchange=function(){S.rsvp=this.value;save();head()};

/* Mesas */
const seats=t=>S.guests.filter(g=>g.table===t.id&&g.status==='ok').reduce((a,g)=>a+people(g),0);
const chip=(g,x)=>`<span class="chip${sel===g.id?' sel':''}" draggable="true" data-c="${g.id}">${esc(g.name)}${g.plus>0?' +'+g.plus:''}${x?`<button data-u="${g.id}" aria-label="Tirar da mesa">✕</button>`:''}</span>`;
function renderTables(){
 const ok=S.guests.filter(g=>g.status==='ok'),free=ok.filter(g=>!S.tables.some(t=>t.id===g.table));
 $('tbls').innerHTML=`<div class="tb pool" data-t=""><div class="th"><b>Sem mesa</b><span>${free.length} convidado(s)</span></div>${free.map(g=>chip(g)).join('')||'<small class="e">Todos os confirmados já têm mesa.</small>'}</div>`+
 S.tables.map(t=>{const n=seats(t);return `<div class="tb${n>t.cap?' over':''}" data-t="${t.id}"><div class="th"><b>${esc(t.name)}</b><span>${n}/${t.cap} lugares${n>t.cap?' – lotada':''}</span><button class="x" data-dt="${t.id}" aria-label="Remover mesa">✕</button></div>${ok.filter(g=>g.table===t.id).map(g=>chip(g,1)).join('')||'<small class="e">Arraste ou toque num convidado e depois aqui.</small>'}</div>`}).join('');
}
const place=(id,t)=>{S.guests.forEach(g=>{if(g.id===id)g.table=t||null});sel=null;save();renderTables()};
$('tAdd').onclick=()=>{const n=$('tn').value.trim();if(!n){toast('Dê um nome à mesa');return}S.tables.push({id:uid(),name:n,cap:+$('tc').value||8});$('tn').value=$('tc').value='';save();renderTables()};
$('tbls').onclick=e=>{const d=e.target.dataset;
 if(d.u)return place(d.u,'');
 if(d.dt){if(confirm('Remover esta mesa? Os convidados voltam para "Sem mesa".')){S.tables=S.tables.filter(t=>t.id!==d.dt);save();renderTables()}return}
 const c=e.target.closest('.chip');if(c){sel=sel===c.dataset.c?null:c.dataset.c;return renderTables()}
 const b=e.target.closest('.tb');if(b&&sel)place(sel,b.dataset.t)};
$('tbls').ondragstart=e=>{const c=e.target.closest('.chip');if(c)e.dataTransfer.setData('text/plain',c.dataset.c)};
$('tbls').ondragover=e=>e.preventDefault();
$('tbls').ondrop=e=>{e.preventDefault();const b=e.target.closest('.tb'),id=e.dataTransfer.getData('text/plain');if(b&&id)place(id,b.dataset.t)};

/* Módulos genéricos: orçamento, presentes, cronograma, fornecedores, cardápio */
const fv=(f,v)=>f[2]==='n'?brl(v):f[2]==='d'?fmtD(v):v;
function renderMod(k){
 const M=MODS[k],rows=(S.data[k]||[]).slice();
 if(M.ord)rows.sort((a,b)=>M.ord(a)<M.ord(b)?-1:1);
 if(M.sum){const a=rows.reduce((s,r)=>s+(+r[M.sum[0]]||0),0),b=rows.reduce((s,r)=>s+(+r[M.sum[1]]||0),0);$(k+'_s').textContent=`${M.sum[2]} ${brl(a)} · Pago ${brl(b)} · Falta ${brl(a-b)}`}
 $(k+'_l').innerHTML=rows.length?rows.map(r=>`<div class="g m"><div class="n"><b>${M.ti.map(x=>esc(r[x]||'')).join(' – ')}</b><small>${M.f.filter(f=>!M.ti.includes(f[0])&&f[2]!=='s'&&r[f[0]]).map(f=>f[1].split(' (')[0]+': '+esc(fv(f,r[f[0]]))).join(' · ')}</small></div>${M.f.filter(f=>f[2]==='s').map(f=>`<select data-k="${k}" data-r="${r.id}" data-f="${f[0]}" aria-label="${f[1]}">${f[3].map(o=>`<option${r[f[0]]===o?' selected':''}>${o}</option>`).join('')}</select>`).join('')}<button class="x" data-k="${k}" data-x="${r.id}" aria-label="Remover">✕</button></div>`).join(''):'<div class="empty">Nada por aqui ainda. Adicione o primeiro item acima.</div>';
}
Object.keys(MODS).forEach(k=>{
 const M=MODS[k],s=document.createElement('section');s.className='panel';s.id=k;
 s.innerHTML=`<div class="add">${M.f.map(f=>f[2]==='s'?`<select id="${k}_${f[0]}" aria-label="${f[1]}">${f[3].map(o=>`<option>${o}</option>`).join('')}</select>`:`<input id="${k}_${f[0]}" type="${{n:'number',d:'date',h:'time',t:'text'}[f[2]]}" ${f[2]==='n'?'step="0.01" min="0" ':''}placeholder="${f[1]}" aria-label="${f[1]}" title="${f[1]}">`).join('')}<button class="btn" data-a="${k}">Adicionar</button></div><div class="sum" id="${k}_s"></div><div id="${k}_l"></div>`;
 $('mods').appendChild(s);
 s.onclick=e=>{
  if(e.target.dataset.a){const r={id:uid()};M.f.forEach(f=>r[f[0]]=$(k+'_'+f[0]).value.trim?$(k+'_'+f[0]).value.trim():$(k+'_'+f[0]).value);
   const key=M.f.find(f=>f[2]!=='s');if(!r[key[0]]){toast('Preencha "'+key[1]+'"');return}
   (S.data[k]=S.data[k]||[]).push(r);M.f.forEach(f=>{if(f[2]!=='s')$(k+'_'+f[0]).value=''});save();renderMod(k);toast('Adicionado')}
  else if(e.target.dataset.x){S.data[k]=S.data[k].filter(r=>r.id!==e.target.dataset.x);save();renderMod(k)}};
 s.onchange=e=>{const d=e.target.dataset;if(d.r){S.data[k].forEach(r=>{if(r.id===d.r)r[d.f]=e.target.value});save();renderMod(k)}};
});

/* Ideias */
function renderIdeas(){
 const G={};IDEAS.forEach(x=>(G[x[2]]=G[x[2]]||[]).push(x));
 if(S.custom.length)G['Suas ideias']=S.custom.map(c=>[c,'Ideia sua']);
 $('ideaList').innerHTML=Object.keys(G).map(k=>`<h3 class="gh"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19C5 9 11 4 20 4c0 9-5 15-15 15zM5 19l7-7"/></svg>${k}</h3>`+G[k].map(x=>`<label class="idea${S.ideas[x[0]]?' done':''}"><input type="checkbox" data-i="${esc(x[0])}"${S.ideas[x[0]]?' checked':''}><div><b>${esc(x[0])}</b><span>${esc(x[1])}</span></div></label>`).join('')).join('');
}
$('ideaList').onchange=e=>{const k=e.target.dataset.i;if(!k)return;S.ideas[k]=e.target.checked;save();renderIdeas()};
$('niBtn').onclick=()=>{const v=$('ni').value.trim();if(!v)return;S.custom.push(v);$('ni').value='';save();renderIdeas()};

/* Abas */
const IC={lista:'<circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6M17 11a3 3 0 000-6M21 20c0-2.6-1.6-4.8-4-5.6"/>',mesas:'<circle cx="12" cy="12" r="5"/><circle cx="12" cy="3.5" r="1.5"/><circle cx="12" cy="20.5" r="1.5"/><circle cx="3.5" cy="12" r="1.5"/><circle cx="20.5" cy="12" r="1.5"/>',orcamento:'<rect x="3" y="6" width="18" height="14" rx="3"/><path d="M3 10h18M16 15h2"/>',presentes:'<rect x="3" y="8" width="18" height="4" rx="1"/><path d="M5 12v8h14v-8M12 8v12M12 8C9 8 8 4.5 10.5 4.5S12 8 12 8zm0 0c3 0 4-3.5 1.5-3.5S12 8 12 8z"/>',cronograma:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',fornecedores:'<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a1 1 0 011-1h4a1 1 0 011 1v2M3 13h18"/>',cardapio:'<path d="M7 3v8M4 3v5a3 3 0 006 0V3M7 11v10M17 21V3c-2.5 1.5-3 5-3 8h3"/>',ideias:'<path d="M9 18h6M10 21h4M12 3a6 6 0 00-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0012 3z"/>'};
const TABS=[['lista','Convidados'],['mesas','Mesas'],['orcamento','Orçamento'],['presentes','Presentes'],['cronograma','Cronograma'],['fornecedores','Fornecedores'],['cardapio','Cardápio'],['ideias','Ideias']];
$('nav').innerHTML=TABS.map((t,i)=>`<button role="tab" aria-selected="${i===0}" data-t="${t[0]}"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true">${IC[t[0]]}</svg>${t[1]}</button>`).join('');
$('nav').onclick=e=>{const b=e.target.closest('button');if(!b)return;
 document.querySelectorAll('#nav button').forEach(x=>x.setAttribute('aria-selected',x===b));
 document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('on',p.id===b.dataset.t));
 if(b.dataset.t==='mesas')renderTables();window.scrollTo(0,0);b.scrollIntoView({inline:'center',block:'nearest'})};
function renderAll(){renderGuests();renderTables()}
$('names').value=S.names;$('date').value=S.date;$('rsvpD').value=S.rsvp;document.title=S.names+' – Nosso Casamento';
renderAll();renderIdeas();Object.keys(MODS).forEach(renderMod);
/* Sincronização: salva neste aparelho e na nuvem (db), aparece em qualquer aparelho logado */
let DB=null,pushT=null;
const DEF=()=>({names:'Karine & Murilo',date:'2033-11-19',rsvp:'',guests:[],tables:[],data:{},ideas:{},custom:[]});
const has=x=>!!x&&((x.guests||[]).length>0||(x.tables||[]).length>0||Object.values(x.data||{}).some(a=>a.length)||(x.custom||[]).length>0||Object.keys(x.ideas||{}).length>0);
const status=m=>{$('sync').textContent=m};
function save(){S._ts=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}push()}
function push(){if(!DB)return;status('Salvando…');clearTimeout(pushT);
 pushT=setTimeout(()=>{DB.doc('casamento/dados').set({json:JSON.stringify(S)}).then(()=>status('Salvo na nuvem'),()=>status('Não foi possível salvar na nuvem. Salvo só neste aparelho.'))},600)}
function refresh(){$('names').value=S.names;$('date').value=S.date;$('rsvp'+'D').value=S.rsvp;document.title=S.names+' – Nosso Casamento';renderAll();renderIdeas();Object.keys(MODS).forEach(renderMod)}
(async()=>{
 try{DB=window.claude?await window.claude.use('db'):null}catch(e){DB=null}
 if(!DB){status('Salvo só neste aparelho');return}
 let first=true;
 DB.doc('casamento/dados').onSnapshot(snap=>{
  let r=null;if(snap.exists){try{r=JSON.parse(snap.data().json)}catch(e){}}
  if(first){first=false;
   if(!r||(!has(r)&&has(S))||(has(S)&&(S._ts||0)>(r._ts||0))){S._ts=S._ts||Date.now();push();return}}
  if(r&&(r._ts||0)>(S._ts||0)){S=Object.assign(DEF(),r);try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}refresh()}
  status('Salvo na nuvem');
 },()=>status('Salvo só neste aparelho'));
})();
</script>
</body>
</html>
